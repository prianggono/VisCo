name: VisCo CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  ui-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: npm run preview -- --host 127.0.0.1 --port 4173 &
      - name: Wait for preview server
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Vite preview did not start on port 4173"
          exit 1
      - run: npx playwright test tests/ui-smoke.test.ts --reporter=line

  native-windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure native host
        run: cmake -S native/WindowsHost -B build/native -A x64
      - name: Build native host
        run: cmake --build build/native --config Release
