name: VisCo UI Smoke
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
